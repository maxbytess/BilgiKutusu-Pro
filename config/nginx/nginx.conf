server {
    listen 8081;
    listen [::]:8081; # IPv6 desteği
    server_name _;

    root /var/www/bilgikutusu;
    index index.html;
    charset utf-8; # Türkçe karakter sorunlarını önler

    # Güvenlik: Nginx sürümünü gizler ve temel tarayıcı korumaları ekler
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Hız: Metin, CSS ve JS dosyalarını sıkıştırarak hızlı yükleme sağlar
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # 1. Ana Portal Arayüzü
    location / {
        try_files $uri $uri/ =404;
    }

    # 2. Kiwix Ters Vekil (Reverse Proxy)
    # Not: Kiwix'i '--urlRootLocation=/kiwix' ile başlatmanız önerilir
    location /kiwix/ {
        proxy_pass http://127.0.0;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kiwix;
        proxy_buffering off; # Arama ve içerik akışını hızlandırır
    }

    # 3. Kütüphane Arşivi (Büyük PDF/Video dosyaları için optimize)
    location /kutuphane/ {
        alias /mnt/BilgiKutusu/;
        autoindex off; # Klasör içeriğinin listelenmesini yasaklar
        limit_except GET HEAD { deny all; } # Sadece indirme/okuma izni verir
        sendfile on; # Büyük dosyaları RAM'i yormadan diskten direkt aktarır
        expires 7d; # Tarayıcıda 7 gün önbelleğe alır
    }

    # 4. Gizli Dosya Koruması (.git, .env vb. erişimi engeller)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
